<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>37-Animations</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            div.escenario-selva {
                background: url(imgs/jungle.png) no-repeat center /contain;
                border-radius: 4px;
                margin-block: 0rem;
                position: relative;
                overflow: hidden;
                height: 400px;
                width: 320px;

                img {
                    border-radius: 0;
                    border: none;
                    position: absolute;
                }

                img.logo {
                    top: 10px;
                    left: 10px;
                    height: 72px;
                    object-fit: contain;
                    z-index: 9;
                    width: 300px;
                    animation: 2s pulsoEmblema ease-in infinite;
                }

                img.dk {
                    top: 140px;
                    left: 100px;
                    width: 140px;
                    object-fit: contain;
                    z-index: 8;
                    animation: 2s saltoMono ease-out infinite;
                }

                div.move {
                    position: absolute;
                    top: 240px;
                    left: 0;
                    animation: 4s recorrido ease-out infinite;

                    img.ryno {
                        width: 140px;
                        object-fit: contain;
                        top: 0;
                        animation: 0.2s reboteCriatura linear infinite;
                    }
                }
            }
        }

        @keyframes pulsoEmblema {

            0%,
            100% { transform: scale(.8) }
            50% { transform: scale(1) }
        }

        @keyframes saltoMono {
            0% {top: 140px; transform: rotateX(0deg);}
            40% {top: 70px; transform: rotateX(0deg);}
            50% {top: 70px; transform: rotateX(360deg);}
            60% {top: 70px; transform: rotateX(360deg);}
            100% {top: 140px; transform: rotateX(360deg);}
        }

        @keyframes reboteCriatura {

            0%, 100% {top: 0px;}
            50% {top: -38px;}
        }

        @keyframes recorrido {
            0% {top: 240px; left: 0px; transform: rotateY(0deg);}
            40% {top: 240px; left: 380px; transform: rotateY(0deg);}
            50% {top: 240px; left: 380px; transform: rotateY(180deg);}
            80% {top: 240px; left: 0px; transform: rotateY(180deg);}
        }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
        </svg>
    </a>
    <main>
        <header class="mainmenu">
            <h1>37-Animations</h1>
            <h4>Feature using @keyframes to create multi-step keyframed visual changes without JavaScript intervention.</h4>
        </header>
        <section>
            <div class="escenario-selva">
                <img src="../03-css/imgs/logo-dk.png" class="logo">
                <img src="../03-css/imgs/dk.png" class="dk">
                <div class="move">
                    <img src="../03-css/imgs/ryno.png" class="ryno">
                </div>
            </div>
        </section>
    </main>
</body>
</html>
