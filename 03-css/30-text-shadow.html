<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-Text Shadow</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            p.txt {
                font-size: 2rem;
                margin-block: 4rem;
                text-align: center;

                &.txt1 {
                    color: black;
                    text-shadow: 0px 0px 16px #fff;
                }
                &.txt2 {
                    color: black;
                    text-shadow: -4px -4px 10px #fff;
                }
                &.txt3 {
                    color: #fff;
                    text-shadow: 2px 2px 0px #fff9, -1px -1px 0px #fff;
                    font-weight: 600;
                }

                &.txt4 {
                    color: #000;
                    -webkit-text-stroke: 1px #fff;
                    filter: drop-shadow(0px 2px 8px red);
                }
            }
        }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
        </svg>
    </a>
    <main>
        <header class="mainmenu">
            <h1>30-Text Shadow</h1>
            <h4>Property that adds shadow effects directly to text content, taking values for offset, blur radius, and color.</h4>
        </header>
        <section>
            <p class="txt txt1">ADSO</p>
            <p class="txt txt2">C.P.I.C</p>
            <p class="txt txt3">SENA</p>
            <p class="txt txt4">Caldas</p>
        </section>
    </main>
</body>
</html>
