<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>42-parallax</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            div.parallax {
                outline: 2px solid #fff;
                border-radius: 12px;
                corner-shape: squircle;
                overflow: hidden;
                position: relative;
                height: 576px;

                div.layer8, div.layer7, div.layer6, div.layer5, 
                div.layer4, div.layer3, div.layer2, div.layer1 {
                    position: absolute;
                    height: 576px;
                    top: 0;
                    left: 0;
                    width: 1024px;
                }

                div.layer8 { background: url(imgs/parallax/layer_08.png) repeat-x;}

                div.layer7 { 
                    background: url(imgs/parallax/layer_07.png) repeat-x;
                    animation: 40s animlayer linear infinite;
                }
                div.layer6 { 
                    background: url(imgs/parallax/layer_06.png) repeat-x;
                    animation: 35s animlayer linear infinite;
                }
                div.layer5 { 
                    background: url(imgs/parallax/layer_05.png) repeat-x;
                    animation: 30s animlayer linear infinite;
                }
                div.layer4 { 
                    background: url(imgs/parallax/layer_04.png) repeat-x;
                    animation: 25s animlayer linear infinite;
                }
                div.layer3 { 
                    background: url(imgs/parallax/layer_03.png) repeat-x;
                    animation: 20s animlayer linear infinite;
                }
                div.layer2 { 
                    background: url(imgs/parallax/layer_02.png) repeat-x;
                    animation: 10s animlayer linear infinite;
                }
                div.layer1 { 
                    background: url(imgs/parallax/layer_01.png) repeat-x;
                    animation: 5s animlayer linear infinite;
                }

                div.runner {
                    position: absolute;
                    background: url(imgs/parallax/running.gif) no-repeat
                                center / cover;
                    height: 200px;
                    transform: scale(.5);
                    bottom: 60px;
                    left: 60px;
                    width: 200px;
                }
            }
        }
        @media (min-width: 1024px) {
            body {
                main {
                    width: 1024px;
                    section {
                        div.parallax {
                            div.runner{
                                left: 380px;
                            }
                        }
                    }
                }
            }
        }
        @keyframes animlayer {
            100% { background-position-x: -1024px; }
        }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
        </svg>
    </a>
    <main>
        <header class="mainmenu">
            <h1>42-parallax</h1>
            <h4>Visual technique where background content moves at a different speed than foreground content during scrolling, creating depth.</h4>
        </header>
        <section>
            <div class="parallax">
                <div class="layer8"></div>
                <div class="layer7"></div>
                <div class="layer6"></div>
                <div class="layer5"></div>
                <div class="layer4"></div>
                <div class="layer3"></div>
                <div class="layer2"></div>
                <div class="layer1"></div>
                <div class="runner"></div>
            </div>
        </section>
    </main>
</body>
</html>
